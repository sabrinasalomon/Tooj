<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .ap { animation: subir .8s cubic-bezier(.2,.7,.3,1) both; }
    .d1 { animation-delay:.05s } .d2 { animation-delay:.20s } .d3 { animation-delay:.35s }
    .d4 { animation-delay:.50s } .d5 { animation-delay:.65s } .d6 { animation-delay:.80s }
    @keyframes subir { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }

    .anillo { animation: girar 26s linear infinite; transform-origin:250px 210px }
    @keyframes girar { to { transform:rotate(360deg) } }

    .late { animation: latir 2.6s ease-in-out infinite }
    @keyframes latir { 0%,100% { opacity:.35 } 50% { opacity:1 } }

    .linea { animation: crecer 1.1s ease-out .9s both }
    @keyframes crecer { from { transform:scaleX(0) } to { transform:scaleX(1) } }

    @media (prefers-reduced-motion: reduce) {
      .ap,.anillo,.late,.linea { animation:none }
    }
  </style>

  <rect x="0" y="0" width="1280" height="420" rx="18" fill="#111111"/>

  <!-- MONOGRAMA -->
  <circle class="anillo" cx="250" cy="210" r="118" fill="none" stroke="#2A2A2A" stroke-width="1.5" stroke-dasharray="30 14"/>
  <circle class="ap d1" cx="250" cy="210" r="86" fill="#1A1A1A"/>
  <text class="ap d2" x="250" y="252" font-size="112" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">T</text>

  <!-- TEXTO -->
  <circle class="late" cx="458" cy="123" r="4" fill="#FFFFFF"/>
  <text class="ap d1" x="478" y="128" font-size="13" font-weight="600" fill="#767676" letter-spacing="3.5">SIN INTERNET · MULTITIENDA · WINDOWS</text>
  <text class="ap d3" x="470" y="234" font-size="88" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Tooj</text>
  <text class="ap d4" x="470" y="288" font-size="30" font-weight="600" fill="#FFFFFF">Todo cuadra.</text>
  <text class="ap d5" x="470" y="324" font-size="15" fill="#BDBDBD">Punto de venta e inventario para cadenas de tiendas.</text>
  <line class="linea" x1="470" y1="348" x2="1180" y2="348" stroke="#2A2A2A" style="transform-origin:470px 348px"/>
  <text class="ap d6" x="470" y="376" font-size="13" fill="#767676">Vende sin internet · Las existencias cuadran · De la caja al almacén central</text>
</svg>
