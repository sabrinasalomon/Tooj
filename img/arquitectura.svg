<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="dato" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
    <marker id="merca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="540" fill="#FAFAFA"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#111111">Arquitectura de Tooj</text>
  <text x="40" y="72" font-size="14" fill="#767676">Las cajas venden aunque no haya internet. Todo se sincroniza solo en cuanto vuelve la conexión.</text>

  <!-- TIENDA -->
  <rect x="40" y="100" width="380" height="250" rx="10" fill="#F2F2F2" stroke="#E0E0E0"/>
  <text x="58" y="126" font-size="13" font-weight="700" fill="#111111" letter-spacing="1">TIENDA (×6)</text>
  <rect x="284" y="109" width="124" height="23" rx="11.5" fill="#767676"/>
  <text x="346" y="125" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Vende sin internet</text>

  <rect x="56" y="142" width="84" height="58" rx="6" fill="#FFFFFF" stroke="#555555"/>
  <text x="98" y="168" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Caja 1</text>
  <text x="98" y="185" font-size="9.5" fill="#767676" text-anchor="middle">copia local</text>

  <rect x="148" y="142" width="84" height="58" rx="6" fill="#FFFFFF" stroke="#555555"/>
  <text x="190" y="168" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Caja 2</text>
  <text x="190" y="185" font-size="9.5" fill="#767676" text-anchor="middle">copia local</text>

  <rect x="240" y="142" width="84" height="58" rx="6" fill="#FFFFFF" stroke="#555555"/>
  <text x="282" y="168" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Caja 3</text>
  <text x="282" y="185" font-size="9.5" fill="#767676" text-anchor="middle">copia local</text>

  <rect x="332" y="142" width="72" height="58" rx="6" fill="#FFFFFF" stroke="#555555"/>
  <text x="368" y="168" font-size="12" font-weight="600" fill="#111111" text-anchor="middle">Caja 4</text>
  <text x="368" y="185" font-size="9.5" fill="#767676" text-anchor="middle">copia local</text>

  <line x1="98" y1="200" x2="150" y2="252" stroke="#555555" stroke-width="1.4" marker-end="url(#dato)"/>
  <line x1="190" y1="200" x2="200" y2="252" stroke="#555555" stroke-width="1.4" marker-end="url(#dato)"/>
  <line x1="282" y1="200" x2="260" y2="252" stroke="#555555" stroke-width="1.4" marker-end="url(#dato)"/>
  <line x1="368" y1="200" x2="310" y2="252" stroke="#555555" stroke-width="1.4" marker-end="url(#dato)"/>
  <text x="230" y="224" font-size="10" fill="#767676" text-anchor="middle">red local</text>

  <rect x="90" y="254" width="280" height="68" rx="8" fill="#111111"/>
  <text x="230" y="280" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Servidor de la tienda</text>
  <text x="230" y="300" font-size="11" fill="#BDBDBD" text-anchor="middle">Existencias de la tienda</text>

  <!-- TIENDA -> NUBE -->
  <line x1="424" y1="250" x2="516" y2="250" stroke="#555555" stroke-width="1.8" marker-start="url(#dato)" marker-end="url(#dato)"/>
  <text x="470" y="228" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="600">Sincronización</text>
  <text x="470" y="241" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="600">automática</text>

  <!-- NUBE -->
  <rect x="520" y="150" width="290" height="200" rx="14" fill="#FFFFFF" stroke="#555555" stroke-width="2"/>
  <text x="665" y="194" font-size="17" font-weight="700" fill="#111111" text-anchor="middle">Servidor central</text>
  <text x="665" y="214" font-size="11" fill="#767676" text-anchor="middle">en la nube</text>
  <line x1="556" y1="232" x2="774" y2="232" stroke="#E6E6E6"/>
  <text x="556" y="258" font-size="11.5" fill="#111111">Todas las tiendas y el CEDIS</text>
  <text x="556" y="284" font-size="11.5" fill="#111111">Catálogo y precios únicos</text>
  <text x="556" y="310" font-size="11.5" fill="#111111">Bitácora y respaldos</text>

  <!-- NUBE -> CEDIS -->
  <line x1="814" y1="176" x2="886" y2="176" stroke="#555555" stroke-width="1.8" marker-start="url(#dato)" marker-end="url(#dato)"/>
  <text x="850" y="160" font-size="10" fill="#111111" text-anchor="middle">pedidos</text>

  <!-- NUBE -> ADMINISTRACIÓN -->
  <line x1="814" y1="308" x2="886" y2="308" stroke="#555555" stroke-width="1.8" marker-start="url(#dato)" marker-end="url(#dato)"/>

  <!-- CEDIS -->
  <rect x="890" y="110" width="350" height="130" rx="10" fill="#F2F2F2" stroke="#555555"/>
  <text x="912" y="140" font-size="14" font-weight="700" fill="#111111">CEDIS · Almacén central</text>
  <text x="912" y="168" font-size="11.5" fill="#111111">Ve las existencias de todas las tiendas</text>
  <text x="912" y="192" font-size="11.5" fill="#111111">Decide cuánto surtir en cada pedido</text>
  <text x="912" y="216" font-size="11.5" fill="#111111">Compara lo enviado con lo recibido</text>

  <!-- ADMINISTRACIÓN -->
  <rect x="890" y="258" width="350" height="122" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text x="912" y="288" font-size="14" font-weight="700" fill="#111111">Administración</text>
  <text x="912" y="314" font-size="11.5" fill="#111111">Catálogo, costos y margen de ganancia</text>
  <text x="912" y="338" font-size="11.5" fill="#111111">Mínimos y promociones</text>
  <text x="912" y="362" font-size="11.5" fill="#111111">Importación desde Excel</text>

  <!-- MERCANCÍA FÍSICA -->
  <path d="M 890 200 L 856 200 L 856 430 L 230 430 L 230 326" fill="none" stroke="#111111" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#merca)"/>
  <rect x="470" y="418" width="330" height="24" rx="12" fill="#FAFAFA"/>
  <text x="635" y="435" font-size="11.5" fill="#111111" text-anchor="middle" font-weight="600">Mercancía física: el CEDIS surte a la tienda</text>

  <!-- LEYENDA -->
  <line x1="40" y1="486" x2="80" y2="486" stroke="#555555" stroke-width="1.8"/>
  <text x="90" y="490" font-size="11" fill="#767676">Datos</text>
  <line x1="150" y1="486" x2="190" y2="486" stroke="#111111" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="200" y="490" font-size="11" fill="#767676">Mercancía física</text>
  <text x="330" y="490" font-size="11" fill="#767676">Si el servidor de la tienda falla, las cajas siguen vendiendo con su copia local.</text>
</svg>
