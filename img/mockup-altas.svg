  <text x="836" y="612" font-size="11" font-weight="600" fill="#111111" text-anchor="end">F4</text>
  <rect x="44" y="624" width="460" height="40" rx="8" fill="#FAFAFA" stroke="#E0E0E0"/>
  <circle cx="70" cy="643" r="7" fill="none" stroke="#767676" stroke-width="1.6"/>
  <line x1="75" y1="648" x2="81" y2="654" stroke="#767676" stroke-width="1.6"/>
  <text x="96" y="649" font-size="13" fill="#111111">sartén</text>
  <rect x="140" y="634" width="2" height="18" fill="#555555"/>
  <text x="44" y="692" font-size="10.5" fill="#767676">Escriba parte del nombre o pase el escáner para</text>
  <text x="44" y="708" font-size="10.5" fill="#767676">ver si el producto ya existe y cuántas piezas hay.</text>

  <text x="528" y="636" font-size="13" fill="#111111">Sartén antiadherente 24 cm</text>
  <text x="528" y="653" font-size="10.5" fill="#767676">7501234500456</text>
  <text x="836" y="645" font-size="15" font-weight="700" fill="#111111" text-anchor="end">52</text>
  <line x1="528" y1="668" x2="836" y2="668" stroke="#F2F2F2"/>
  <text x="528" y="691" font-size="13" fill="#111111">Sartén hondo 28 cm</text>
  <text x="528" y="708" font-size="10.5" fill="#767676">7501234500457</text>
  <text x="836" y="700" font-size="15" font-weight="700" fill="#111111" text-anchor="end">18</text>

  <!-- PIE -->
  <rect x="0" y="744" width="1280" height="56" fill="#F2F2F2"/>
  <text x="28" y="770" font-size="11.5" font-weight="600" fill="#111111">F2</text>
  <text x="50" y="770" font-size="11.5" fill="#767676">Capturar cantidad</text>
  <text x="190" y="770" font-size="11.5" font-weight="600" fill="#111111">F3</text>
  <text x="212" y="770" font-size="11.5" fill="#767676">Deshacer último movimiento</text>
  <text x="400" y="770" font-size="11.5" font-weight="600" fill="#111111">F4</text>
  <text x="422" y="770" font-size="11.5" fill="#767676">Buscar producto</text>
  <text x="552" y="770" font-size="11.5" font-weight="600" fill="#111111">F10</text>
  <text x="580" y="770" font-size="11.5" fill="#767676">Terminar altas</text>
  <text x="1252" y="770" font-size="11.5" fill="#767676" text-anchor="end">Sesión de altas ALT-0123</text>
