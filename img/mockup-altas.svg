  <text x="44" y="274" font-size="11.5" fill="#767676">7501234500456</text>
  <text x="200" y="274" font-size="13.5" fill="#111111">Sartén antiadherente 24 cm</text>
  <text x="560" y="274" font-size="12" fill="#767676">Cantidad capturada</text>
  <text x="762" y="274" font-size="14" font-weight="700" fill="#111111" text-anchor="end">+30</text>
  <text x="836" y="274" font-size="13.5" fill="#111111" text-anchor="end">52</text>
  <line x1="44" y1="298" x2="836" y2="298" stroke="#F2F2F2"/>

  <!-- Fila 4 -->
  <text x="44" y="330" font-size="11.5" fill="#767676">7501234500789</text>
  <text x="200" y="330" font-size="13.5" fill="#111111">Set de jardinería 3 piezas</text>
  <text x="560" y="330" font-size="12" fill="#767676">Código de caja · 12 pzas</text>
  <text x="762" y="330" font-size="14" font-weight="700" fill="#111111" text-anchor="end">+12</text>
  <text x="836" y="330" font-size="13.5" fill="#111111" text-anchor="end">19</text>
  <line x1="44" y1="354" x2="836" y2="354" stroke="#F2F2F2"/>

