  <text x="44" y="386" font-size="11.5" fill="#767676">7501234501011</text>
  <text x="200" y="386" font-size="13.5" fill="#111111">Juguete didáctico</text>
  <text x="560" y="386" font-size="12" fill="#767676">Pieza por pieza</text>
  <text x="762" y="386" font-size="14" font-weight="700" fill="#111111" text-anchor="end">+8</text>
  <text x="836" y="386" font-size="13.5" fill="#111111" text-anchor="end">24</text>
  <line x1="44" y1="410" x2="836" y2="410" stroke="#F2F2F2"/>

  <text x="44" y="440" font-size="12" fill="#767676">Escanee el siguiente producto…</text>
  <rect x="222" y="427" width="2" height="16" fill="#555555"/>

  <!-- ÚLTIMO ESCANEADO -->
  <rect x="40" y="466" width="800" height="86" rx="8" fill="#F2F2F2"/>
  <text x="60" y="492" font-size="10.5" font-weight="600" fill="#767676" letter-spacing="0.6">ÚLTIMO PRODUCTO ESCANEADO</text>
  <text x="60" y="522" font-size="20" font-weight="700" fill="#111111">Juego de platos 6 piezas</text>
  <text x="60" y="542" font-size="11.5" fill="#767676">Se sumaron 24 piezas con el código de la caja</text>
  <text x="820" y="512" font-size="11.5" fill="#767676" text-anchor="end">Existencia en tienda</text>
  <text x="820" y="542" font-size="26" font-weight="700" fill="#111111" text-anchor="end">46</text>

