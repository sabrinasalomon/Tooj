  <text x="1000" y="162" font-size="19" font-weight="700" fill="#111111">ACTIVADO</text>
  <text x="904" y="200" font-size="11.5" fill="#767676">Con el modo apagado, escanear no suma</text>
  <text x="904" y="218" font-size="11.5" fill="#767676">nada a la existencia.</text>

  <!-- PANEL: FORMAS DE ALTA -->
  <rect x="880" y="248" width="376" height="164" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <text x="904" y="280" font-size="13" font-weight="600" fill="#767676" letter-spacing="0.6">FORMAS DE DAR DE ALTA</text>
  <circle cx="912" cy="312" r="5" fill="#555555"/>
  <text x="928" y="317" font-size="12.5" fill="#111111">Pieza por pieza</text>
  <circle cx="912" cy="344" r="5" fill="#555555"/>
  <text x="928" y="349" font-size="12.5" fill="#111111">Escanear y capturar la cantidad</text>
  <circle cx="912" cy="376" r="5" fill="#555555"/>
  <text x="928" y="381" font-size="12.5" fill="#111111">Código de caja con su equivalencia</text>

  <!-- PANEL: RESUMEN -->
  <rect x="880" y="426" width="376" height="126" rx="10" fill="#F2F2F2"/>
  <text x="904" y="458" font-size="12.5" fill="#767676">Piezas dadas de alta en esta sesión</text>
  <text x="1232" y="496" font-size="40" font-weight="700" fill="#111111" text-anchor="end">86</text>
  <text x="904" y="530" font-size="12" fill="#767676">Productos distintos: 5</text>

  <!-- BOTÓN -->
  <rect x="880" y="570" width="376" height="62" rx="8" fill="#111111"/>
  <text x="908" y="608" font-size="17" font-weight="700" fill="#FFFFFF">Terminar altas</text>
  <text x="1232" y="608" font-size="14" font-weight="600" fill="#BDBDBD" text-anchor="end">F10</text>

  <!-- BUSCADOR DE PRODUCTOS -->
  <rect x="24" y="584" width="832" height="132" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
