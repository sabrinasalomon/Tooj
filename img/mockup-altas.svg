<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#FAFAFA"/>

  <!-- BARRA SUPERIOR -->
  <rect x="0" y="0" width="1280" height="64" fill="#111111"/>
  <text x="28" y="41" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">Tooj</text>
  <line x1="96" y1="18" x2="96" y2="46" stroke="#444444"/>
  <text x="112" y="40" font-size="13" fill="#BDBDBD">Tienda Centro · Almacén</text>
  <rect x="800" y="18" width="240" height="28" rx="14" fill="#767676"/>
  <text x="920" y="37" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Modo ALTAS activado</text>
  <text x="1252" y="40" font-size="12" fill="#BDBDBD" text-anchor="end">Luis R. · Almacén · 13:42</text>

  <!-- TARJETA DE MOVIMIENTOS -->
  <rect x="24" y="88" width="832" height="480" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
  <path d="M 24 98 a 10 10 0 0 1 10 -10 h 812 a 10 10 0 0 1 10 10 v 28 h -832 z" fill="#F2F2F2"/>
  <text x="44" y="116" font-size="11" font-weight="600" fill="#767676" letter-spacing="0.6">CÓDIGO</text>
  <text x="200" y="116" font-size="11" font-weight="600" fill="#767676" letter-spacing="0.6">PRODUCTO</text>
  <text x="560" y="116" font-size="11" font-weight="600" fill="#767676" letter-spacing="0.6">FORMA DE ALTA</text>
  <text x="762" y="116" font-size="11" font-weight="600" fill="#767676" letter-spacing="0.6" text-anchor="end">PIEZAS</text>
  <text x="836" y="116" font-size="11" font-weight="600" fill="#767676" letter-spacing="0.6" text-anchor="end">EXIST.</text>

  <!-- Fila 1 -->
  <rect x="32" y="130" width="816" height="56" rx="6" fill="#F7F7F7"/>
  <text x="44" y="162" font-size="11.5" fill="#767676">7501234500123</text>
  <text x="200" y="162" font-size="13.5" fill="#111111">Juego de platos 6 piezas</text>
  <text x="560" y="162" font-size="12" fill="#767676">Código de caja · 24 pzas</text>
  <text x="762" y="162" font-size="14" font-weight="700" fill="#111111" text-anchor="end">+24</text>
  <text x="836" y="162" font-size="13.5" fill="#111111" text-anchor="end">46</text>

  <!-- Fila 2 -->
  <text x="44" y="218" font-size="11.5" fill="#767676">7501234500017</text>
  <text x="200" y="214" font-size="13.5" fill="#111111">Playera cuello redondo</text>
  <text x="200" y="232" font-size="10.5" fill="#767676">Talla M · Azul</text>
  <text x="560" y="218" font-size="12" fill="#767676">Pieza por pieza</text>
  <text x="762" y="218" font-size="14" font-weight="700" fill="#111111" text-anchor="end">+12</text>
  <text x="836" y="218" font-size="13.5" fill="#111111" text-anchor="end">38</text>
  <line x1="44" y1="242" x2="836" y2="242" stroke="#F2F2F2"/>

